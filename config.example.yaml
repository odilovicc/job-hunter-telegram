admin_bot:
  bot_token: ""   # токен от @BotFather
  chat_id:        # числовой chat_id администратора (можно узнать через @userinfobot)

# Источники вакансий. Можно включать/выключать независимо. Telegram — как и
# раньше, событийный (слушает каналы через Telethon). Indeed — опрашивается
# по расписанию (poll_interval_sec) через providers/indeed.py.
sources:
  telegram:
    enabled: true
  indeed:
    enabled: false
    # ВАЖНО: у Indeed нет официального API для поиска вакансий от лица соискателя
    # (Job Sync API / Indeed Apply — только для работодателей/ATS). Поэтому этот
    # источник реализован через Adzuna API (официальный, бесплатный в рамках
    # лимитов агрегатор вакансий, НЕ является самим Indeed) — см. подробности в
    # providers/indeed.py. Сам бот НЕ ходит на indeed.com и не эмулирует браузер.
    #
    # Adzuna покрывает ограниченный список стран (gb, us, de, fr, ca, au, in, pl, ...) —
    # Узбекистан и Центральную Азию НЕ покрывает. Если ваша аудитория там — ищите
    # удалённые/remote вакансии в поддерживаемой стране (например, country: "gb" +
    # "remote" в search_queries), а не локальные вакансии.
    adzuna:
      app_id: ""   # из https://developer.adzuna.com/ (бесплатная регистрация)
      app_key: ""
      country: "gb"  # ISO-код страны из списка поддерживаемых Adzuna
    search_queries:
      - "Vue developer"
      - "Frontend developer remote"
    locations:
      - ""  # пустая строка = поиск по всей стране; или укажите город/регион, напр. "London"
    poll_interval_sec: 1800

user_profile:
  resume_path: "resume.pdf"  # используется, если ниже не задан блок resumes (обратная совместимость)
  position: "Middle Vue / Junior PHP Developer"

# Несколько резюме под разные стеки — AI сам порекомендует подходящее
# (см. recommended_resume в structured analysis, ai_generator.py). Если этот
# блок не задан, используется единственное резюме из user_profile.resume_path.
# resumes:
#   default: "resume.pdf"
#   frontend: "resumes/frontend.pdf"
#   fullstack: "resumes/fullstack.pdf"
#   laravel: "resumes/laravel.pdf"

# Профиль кандидата — единственный источник правды о кандидате для AI.
# Если поле не заполнено, AI обязан отвечать needs_user_input вместо того,
# чтобы придумывать (особенно критично для salary_expectation/work_authorization).
# Секретов сюда не кладите — только фактические данные о кандидате.
candidate:
  name: ""
  email: ""
  phone: ""
  location: ""
  skills: []
  experience: []
  education: []
  languages: []
  linkedin: ""
  github: ""
  portfolio: ""
  salary_expectation: ""   # пусто = не настроено
  work_authorization: ""   # пусто = не настроено (вопросы про visa/authorization всегда требуют подтверждения человеком)
  relocation: ""

filters:
  level_1_keywords:
    # Вакансия пройдет на Уровень 2, если содержит ХОТЯ БЫ ОДНО слово из include
    include:
      - "vue"
      - "vue.js"
      - "vuejs"
      - "vue 3"
      - "nuxt"
      - "nuxt.js"
      - "nuxt 3"
      - "frontend"
      - "front-end"
      - "фронтенд"
      - "фронт-енд"
      - "laravel"
      - "php"
      - "javascript"
      - "typescript"
      - "node.js"
    
    # Вакансия будет ОТКЛОНЕНА, если содержит ХОТЯ БЫ ОДНО слово из exclude
    exclude:
      - "senior"
      - "синьор"
      - "сеньор"
      - "lead"
      - "лид"
      - "cto"
      - "react"
      - "angular"
      - "svelte"
      - "kotlin"
      - "spring"
      - "java разработчик"
      - "java developer"
      - "java программист"
      - "ruby"
      - "ios"
      - "android"
      - "преподаватель"
      - "ментор"

  level_2_scoring:
    min_pass_score: 5
    rules:
      # --- График и формат работы ---
      - pattern: "удален(ка|ная|но|ку)"
        score: 3
        label: "удалёнка"
      - pattern: "remote"
        score: 3
        label: "remote"
      - pattern: "гибрид"
        score: 1
        label: "гибрид"
      - pattern: "офис"
        score: 0
        label: "офис"
      - pattern: "(?<!\\d)5/2(?!\\d)"
        score: 2
        label: "5/2"
      - pattern: "(?<!\\d)6/1(?!\\d)"
        score: 1
        label: "6/1"
      - pattern: "part-time"
        score: 1
        label: "part-time"
      
      # --- Технологии (бонусные баллы, если стек идеальный) ---
      - pattern: "vue 3"
        score: 1
        label: "Vue 3"
      - pattern: "nuxt 3"
        score: 1
        label: "Nuxt 3"
      - pattern: "typescript"
        score: 1
        label: "TypeScript"
      - pattern: "tailwind"
        score: 1
        label: "Tailwind"
      
      # --- Опыт ---
      - pattern: "middle"
        score: 2
        label: "middle"
      - pattern: "мидл"
        score: 2
        label: "мидл"
      - pattern: "миддл"
        score: 2
        label: "миддл"
      - pattern: "junior"
        score: 1
        label: "junior"
      - pattern: "джуниор"
        score: 1
        label: "джуниор"
      - pattern: "джун"
        score: 1
        label: "джун"

ai:
  gemini_api_key: ""
  prompt_template: |
    Ты — профессиональный программист. Твоя специализация: Vue Frontend (Middle) и PHP/Laravel (Junior).
    Вот текст вакансии:
    {vacancy_text}

    Напиши короткое, убедительное и вежливое сопроводительное письмо (максимум 70-100 слов) для отклика на эту вакансию от моего лица.
    - Покажи, что ты понимаешь, кого они ищут.
    - Обязательно упомяни, что мое резюме прикреплено к сообщению.
    - Пиши уверенно, но без высокомерия и без лишней "воды".
    - Пиши на том же языке, на котором написана вакансия.
